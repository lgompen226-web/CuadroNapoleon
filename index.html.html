<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dentro de «La coronación de Napoleón»</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..700;1,6..96,400..600&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ground:#E3E9E2; --surface:#F3F5EF; --ink:#16271F; --soft:#4C5F55;
  --line:#B9C6BB; --velvet:#8C1C2B; --gold:#8A6A1C; --on-velvet:#FBF4E6;
  --stage:#0F1C17;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ground:#12221C; --surface:#1A2F27; --ink:#EDE8DA; --soft:#A9B8AC;
    --line:#35493F; --velvet:#B5303F; --gold:#D2AE5A; --on-velvet:#FFF6E8; --stage:#0A1511;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#12221C; --surface:#1A2F27; --ink:#EDE8DA; --soft:#A9B8AC;
  --line:#35493F; --velvet:#B5303F; --gold:#D2AE5A; --on-velvet:#FFF6E8; --stage:#0A1511;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--ground);color:var(--ink);
  font-family:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:1.0625rem;line-height:1.55}
.wrap{max-width:76rem;margin:0 auto;padding:1.25rem 1rem 3rem}
header.top{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:.5rem 1.5rem;margin-bottom:1rem}
header.top h1{font-family:"Bodoni Moda","Didot","Bodoni MT",Georgia,serif;font-weight:500;
  font-size:clamp(1.5rem,1.1rem + 1.8vw,2.4rem);line-height:1.1;margin:0;letter-spacing:-.005em}
header.top p{margin:0;color:var(--soft);font-size:.95rem}
.layout{display:grid;gap:1.25rem}
@media (min-width:60rem){.layout{grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);align-items:start}
  .stagecol{position:sticky;top:calc(env(safe-area-inset-top,0px) + 1rem)}}

/* la cámara */
.camera{position:relative;aspect-ratio:1260/894;overflow:hidden;background:var(--stage);border-radius:3px;
  box-shadow:0 0 0 1px var(--line),0 0 0 7px var(--surface),0 0 0 8px var(--gold)}
.plate{position:absolute;inset:0;transform-origin:0 0;transition:transform 1.3s cubic-bezier(.6,.05,.2,1)}
.plate img{display:block;width:100%;height:100%;object-fit:fill}
.camera::after{content:"";position:absolute;inset:0;pointer-events:none;
  box-shadow:inset 0 0 70px 10px rgba(6,14,11,.55);opacity:0;transition:opacity 1s}
.camera.zoomed::after{opacity:1}
.pin{position:absolute;transform:translate(-50%,-50%);width:2rem;height:2rem;border-radius:50%;
  border:1.5px solid var(--on-velvet);background:var(--velvet);color:var(--on-velvet);
  font:600 .9rem/1 "Figtree",sans-serif;cursor:pointer;padding:0;transition:opacity .4s}
.camera.zoomed .pin{opacity:0;pointer-events:none}
.pin:hover{background:#6d1420}
.where{margin:.9rem 0 0;display:flex;gap:.9rem;align-items:center}
.mini{position:relative;flex:none;width:6.5rem;aspect-ratio:1260/894;border:1px solid var(--line);overflow:hidden;border-radius:2px}
.mini img{width:100%;height:100%;display:block;filter:saturate(.6) brightness(.8)}
.mini i{position:absolute;border:2px solid var(--on-velvet);outline:1px solid var(--velvet);
  transition:all 1.3s cubic-bezier(.6,.05,.2,1)}
.where p{margin:0;font-size:.92rem;color:var(--soft)}
.where strong{display:block;color:var(--ink);font-weight:600;font-size:1rem}

/* recorrido */
.rail{display:flex;flex-wrap:wrap;gap:.35rem;margin:1rem 0 0;padding:0;list-style:none}
.rail button{min-width:2.25rem;height:2.25rem;border-radius:50%;border:1px solid var(--line);background:transparent;
  color:var(--soft);font:500 .9rem/1 "Figtree",sans-serif;cursor:pointer}
.rail button.seen{color:var(--ink);border-color:var(--soft)}
.rail button[aria-current="step"]{background:var(--velvet);border-color:var(--velvet);color:var(--on-velvet)}
.steps{display:flex;gap:.6rem;margin-top:1rem}
.steps button{flex:1;padding:.75rem 1rem;border-radius:3px;font:600 1rem/1.2 "Figtree",sans-serif;cursor:pointer}
#next{background:var(--velvet);color:var(--on-velvet);border:1px solid var(--velvet)}
#prev{background:transparent;color:var(--ink);border:1px solid var(--line)}
.steps button:disabled{opacity:.4;cursor:default}
button:focus-visible,summary:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

/* panel */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:3px;padding:1.4rem 1.25rem 1.6rem}
@media (min-width:40rem){.panel{padding:1.8rem 1.9rem 2rem}}
.count{margin:0;color:var(--gold);font-weight:600;font-size:.95rem}
.panel h2{font-family:"Bodoni Moda","Didot",Georgia,serif;font-weight:500;font-size:clamp(1.6rem,1.3rem + 1.2vw,2.15rem);
  line-height:1.12;margin:.2rem 0 .2rem}
.place{margin:0 0 1rem;color:var(--soft);font-style:italic;font-family:"Bodoni Moda",Georgia,serif;font-size:1.05rem}
.voice p{margin:0 0 .85rem;max-width:62ch}
.voice p:first-child{font-size:1.14rem;line-height:1.5}
.work{margin-top:1.3rem;padding-top:1.1rem;border-top:1px solid var(--line)}
.work h3{margin:0 0 .6rem;font:600 1rem/1.3 "Figtree",sans-serif;color:var(--velvet)}
.work h4{margin:1rem 0 .3rem;font:600 .98rem/1.3 "Figtree",sans-serif}
.work ul,.work ol{margin:.2rem 0 .6rem;padding-left:1.15rem;max-width:62ch}
.work li{margin-bottom:.35rem}
.work p{margin:0 0 .7rem;max-width:62ch}
dl.ficha{display:grid;grid-template-columns:auto 1fr;gap:.25rem .9rem;margin:.3rem 0 .6rem}
dl.ficha dt{color:var(--soft)} dl.ficha dd{margin:0}
.tag{display:inline-block;font-size:.78rem;font-weight:600;padding:.08rem .5rem;border-radius:99px;margin-right:.35rem;
  border:1px solid currentColor;vertical-align:.08em;white-space:nowrap}
.tag.d{color:var(--ink)} .tag.i{color:var(--velvet)} .tag.t{color:var(--gold)}
.legend{font-size:.88rem;color:var(--soft);margin-top:1rem}
details{border-top:1px solid var(--line);padding:.6rem 0}
details summary{cursor:pointer;font-weight:600}
details p{margin:.5rem 0 0}
.index{margin-top:1.25rem}
.index summary{font-weight:600;cursor:pointer;padding:.3rem 0}
.index ol{margin:.5rem 0 0;padding-left:1.3rem}
.index li{margin-bottom:.4rem}
.index button{background:none;border:0;padding:0;margin-left:.3rem;color:var(--velvet);font:inherit;font-weight:600;
  text-decoration:underline;text-underline-offset:3px;cursor:pointer}
a{color:var(--velvet)}
@media (prefers-reduced-motion:reduce){.plate,.mini i,.camera::after{transition:none}}
</style>
</head>

<script>
const D='<span class="tag d">Dato</span>', I='<span class="tag i">Interpretación</span>', T='<span class="tag t">Tradición</span>';
const STOPS=[
{ t:"Entro en Notre-Dame", place:"París, 2 de diciembre de 1804", look:"La escena completa", f:[.5,.5,1],
  voice:`<p>Hace frío y llevo horas de pie. La catedral está llena y todo el mundo mira al mismo punto. Yo también.</p>
  <p>Lo primero que noto es el orden. Hay más de cien personas con nombre y apellidos y nadie tapa a nadie: están colocadas como actores en un escenario, en una franja horizontal, igual que las figuras de un relieve romano.</p>
  <p>Lo que tengo delante es la parte central del cuadro. El lienzo entero es más ancho y, visto en el museo, los personajes son casi de mi tamaño.</p>`,
  ap:"Apartado 4. Explicación de la obra (ficha técnica)",
  work:`<dl class="ficha">
   <dt>Título</dt><dd>La consagración del emperador Napoleón I y la coronación de la emperatriz Josefina en Notre-Dame de París, el 2 de diciembre de 1804</dd>
   <dt>Autor</dt><dd>Jacques-Louis David</dd>
   <dt>Fecha</dt><dd>1805–1807</dd>
   <dt>Técnica</dt><dd>Óleo sobre lienzo</dd>
   <dt>Medidas</dt><dd>Unos 6,2 × 9,8 metros</dd>
   <dt>Lugar</dt><dd>Museo del Louvre, París</dd>
  </dl>
  <p>${D}Fue un encargo del propio Napoleón y se presentó al público en el Salón de 1808.</p>
  <p>Pulsa los números sobre el cuadro o usa «Siguiente parada» para ir acercándote.</p>` },

{ t:"Levanto la vista", place:"Los muros de la catedral", look:"Pilastras y decorado", f:[.33,.15,2.1],
  voice:`<p>Notre-Dame es una catedral gótica, pero desde aquí casi no se nota. La han vestido para la ocasión con pilastras, mármoles, tapices y cortinajes.</p>
  <p>No es casualidad. En 1804 lo que se lleva es parecerse a la Roma antigua, no a la Edad Media. Esa moda tiene nombre: Neoclasicismo.</p>
  <p>${D}El decorado de la ceremonia lo diseñaron los arquitectos Percier y Fontaine.</p>`,
  ap:"Apartado 1. Características de la pintura neoclásica",
  work:`<p>El Neoclasicismo (hacia 1760–1830) reacciona contra el Rococó, que se veía frívolo, y toma como modelo Grecia y Roma, redescubiertas con las excavaciones de Pompeya y Herculano.</p>
  <ul>
   <li><b>Temas serios:</b> historia, virtud, heroísmo y, con Napoleón, exaltación del poder. Aquí: una ceremonia de Estado.</li>
   <li><b>El dibujo manda sobre el color:</b> contornos limpios y pincelada que no se ve. Aquí: cada rostro es un retrato nítido.</li>
   <li><b>Composición ordenada,</b> a menudo como un friso. Aquí: la fila horizontal de figuras.</li>
   <li><b>Luz clara</b> que modela los cuerpos como esculturas. Aquí: cae sobre los dos protagonistas.</li>
   <li><b>Arte ligado a la política.</b> Aquí: es un encargo del emperador.</li>
  </ul>
  <p>${I}Muchos autores hablan de un Neoclasicismo «imperial»: más lujoso y ceremonial que el de las primeras obras de David, que eran muy austeras.</p>` },

{ t:"Los hombres del nuevo régimen", place:"A mi derecha, de espaldas", look:"Los altos cargos del Imperio", f:[.74,.6,2.0],
  voice:`<p>Casi me rozan. Son los grandes dignatarios, con capas oscuras y sombreros de plumas, y sostienen las insignias imperiales.</p>
  <p>Pienso en lo que han visto estos hombres en quince años: un rey absoluto, una revolución, una república, una guillotina muy ocupada y ahora un emperador. Varios han servido a todos sin despeinarse.</p>
  <p>${D}Entre ellos se identifica habitualmente a Lebrun, Cambacérès, Berthier y Talleyrand.</p>`,
  ap:"Apartado 2. Breve repaso de la época",
  work:`<ul>
   <li><b>1789:</b> estalla la Revolución francesa. Fin de la monarquía absoluta.</li>
   <li><b>1793:</b> Luis XVI es ejecutado. Comienza el Terror.</li>
   <li><b>1799:</b> el general Napoleón Bonaparte da un golpe de Estado (18 de Brumario) y se hace Primer Cónsul.</li>
   <li><b>1802:</b> cónsul vitalicio.</li>
   <li><b>1804:</b> el Senado lo proclama emperador y un plebiscito lo confirma. El 2 de diciembre se celebra la ceremonia.</li>
  </ul>
  <p>${I}¿Por qué emperador? Las razones que suelen darse: hacer su poder hereditario, ponerse a la altura de los reyes de Europa y presentarse como el hombre que trae orden después del caos.</p>` },

{ t:"A tres pasos de Napoleón", place:"En las gradas, en el centro", look:"Napoleón con la corona en alto", f:[.285,.42,2.7],
  voice:`<p>Está de pie, un escalón por encima de todos. Ya lleva su corona puesta: se la ha colocado él mismo hace un momento. Lo que veo ahora es el instante siguiente, cuando levanta otra corona para Josefina.</p>
  <p>Todas las líneas de la sala acaban en esas dos manos. David ha puesto ahí el punto al que va la mirada, quieras o no.</p>`,
  ap:"Apartados 4 y 6. La escena y sus símbolos",
  work:`<ul>
   <li><b>Corona de laurel dorada:</b> ${I}lo presenta como heredero de los emperadores romanos.</li>
   <li><b>Manto de terciopelo con armiño:</b> ${D}el armiño era la piel reservada a los reyes.</li>
   <li><b>Abejas de oro bordadas:</b> ${D}Napoleón las eligió como emblema en lugar de la flor de lis de los Borbones.</li>
  </ul>
  <p>${D}Se conserva un dibujo previo de David en el que Napoleón se corona a sí mismo. Después cambió la idea.</p>
  <p>${T}Se cuenta que el cambio lo sugirió Gérard, alumno de David.</p>
  <p>${I}Coronar a Josefina da una imagen más amable que la de un hombre que se corona solo, y evita enseñar el gesto más polémico de la ceremonia.</p>` },

{ t:"Bajo la mirada hacia Josefina", place:"Al pie de las gradas", look:"Josefina arrodillada y su manto", f:[.1,.63,2.3],
  voice:`<p>Josefina está de rodillas sobre un cojín, con las manos juntas y la cabeza inclinada. El manto rojo pesa tanto que dos damas se lo sostienen por detrás.</p>
  <p>Me fijo en su cara y algo no cuadra: parece una muchacha.</p>`,
  ap:"Apartados 4 y 6. La escena y sus símbolos",
  work:`<p>${D}Josefina tenía 41 años. David la pinta bastante más joven.</p>
  <p>${D}La pareja se había casado por la Iglesia la víspera, porque el Papa lo exigió para celebrar la ceremonia.</p>
  <p>${I}Él de pie y dando, ella de rodillas y recibiendo: el cuadro dice que todo poder sale de las manos de Napoleón.</p>
  <p>${D}Cinco años después, en 1809, Napoleón se divorció de ella porque no le daba un heredero. El cuadro promete una dinastía que con Josefina no llegó.</p>` },

{ t:"El invitado que no corona a nadie", place:"Detrás de Napoleón, sentado", look:"El papa Pío VII", f:[.44,.47,2.7],
  voice:`<p>Detrás del emperador, sentado y vestido de blanco, está el papa Pío VII. Ha cruzado media Europa para estar aquí y su papel es mínimo: levanta la mano derecha y bendice.</p>
  <p>Hace mil años fue un papa quien coronó a Carlomagno. Hoy el papa mira.</p>`,
  ap:"Apartado 6. Simbolismo",
  work:`<p>${T}Se cuenta que David lo pintó primero con las manos sobre las rodillas y que Napoleón protestó: no lo había hecho venir de tan lejos para que no hiciera nada. David le levantó la mano.</p>
  <p>${D}Napoleón había firmado la paz con la Iglesia en el Concordato de 1801, tras los años de enfrentamiento de la Revolución.</p>
  <p>${I}El mensaje es doble: la Iglesia aprueba al emperador, pero no es ella quien le da el poder.</p>` },

{ t:"La madre que no estuvo", place:"El palco del centro", look:"Letizia, madre de Napoleón", f:[.07,.31,2.7],
  voice:`<p>Miro al palco. En el mejor sitio de la sala, sentada y de frente, hay una señora que lo preside todo: Letizia, la madre del emperador.</p>
  <p>El detalle es que ese día no vino.</p>`,
  ap:"Apartado 6. Simbolismo",
  work:`<p>${D}Letizia no asistió a la ceremonia. Estaba en Roma, disgustada por la pelea de Napoleón con su hermano Luciano.</p>
  <p>${D}Napoleón pidió que apareciera en el cuadro de todos modos.</p>
  <p>${I}Una madre orgullosa en el centro vende la idea de una familia unida detrás del emperador. Es la mentira más descarada del lienzo y por eso es la mejor para explicar qué es propaganda.</p>` },

{ t:"El hombre del cuaderno", place:"El palco de arriba", look:"David, dibujando entre el público", f:[.1,.11,2.9],
  voice:`<p>Un piso más arriba, entre los invitados, hay un hombre que no mira la ceremonia como los demás: la dibuja. Es Jacques-Louis David, que se ha metido en su propio cuadro.</p>
  <p>Con esta resolución es una mancha, pero está ahí. Firmar con un autorretrato era una forma de decir «yo lo vi».</p>`,
  ap:"Apartado 3. El autor y otras obras",
  work:`<ul>
   <li><b>1748:</b> nace en París. Se forma con el pintor Vien.</li>
   <li><b>1774:</b> gana el Premio de Roma y pasa varios años en Italia estudiando el arte antiguo.</li>
   <li><b>Revolución:</b> es diputado, vota la muerte de Luis XVI y es amigo de Robespierre. Cuando este cae, en 1794, acaba en prisión.</li>
   <li><b>1804:</b> Napoleón lo nombra Primer Pintor del Emperador.</li>
   <li><b>1816:</b> vuelven los Borbones y tiene que exiliarse en Bruselas, donde muere en 1825.</li>
  </ul>
  <h4>Otras obras</h4>
  <ul>
   <li>El juramento de los Horacios (1784)</li>
   <li>La muerte de Marat (1793)</li>
   <li>Las Sabinas (1799)</li>
   <li>Napoleón cruzando los Alpes (1801)</li>
  </ul>` },

{ t:"El clan Bonaparte", place:"A mi izquierda", look:"Hermanas y cuñadas del emperador", f:[.04,.5,2.3],
  voice:`<p>A este lado está la familia. En el lienzo completo el grupo sigue hacia la izquierda, con los hermanos José y Luis; lo que tengo más cerca son las hermanas y cuñadas, con vestidos claros y diademas.</p>
  <p>Sonríen lo justo. Algunas de ellas no soportaban a Josefina.</p>`,
  ap:"Apartado 6. Simbolismo (resumen)",
  work:`<p>${D}Las hermanas de Napoleón protestaron por tener que llevar la cola del manto de Josefina.</p>
  <p>${I}Colocar a toda la familia junta presenta a los Bonaparte, que quince años antes eran una familia corsa sin fortuna, como una nueva dinastía.</p>
  <h4>Los símbolos, de un vistazo</h4>
  <ul>
   <li>Laurel: Roma.</li>
   <li>Abejas y armiño: realeza nueva, distinta de los Borbones.</li>
   <li>Papa que bendice: aprobación de la Iglesia.</li>
   <li>Madre en el palco: familia unida.</li>
   <li>Josefina joven y arrodillada: el poder lo reparte él.</li>
  </ul>` },

{ t:"Doy unos pasos atrás", place:"De vuelta al centro de la nave", look:"La escena completa", f:[.5,.5,1],
  voice:`<p>Vuelvo a verlo todo junto y ahora lo miro distinto. Sé quién falta, quién sobra y a quién le han quitado años.</p>
  <p>Nada de esto es un descuido. Cada cambio lo pidió o lo aprobó el hombre de la corona de laurel.</p>`,
  ap:"Apartados 5 y 7. Por qué es importante. David y Napoleón",
  work:`<h4>Por qué es importante</h4>
  <ul>
   <li><b>Como obra de arte:</b> es una de las cumbres de la pintura neoclásica. Organizar a tanta gente sin que la escena se vuelva un lío es una exhibición de oficio.</li>
   <li><b>Como documento:</b> muestra la ceremonia, los trajes y la corte. Y, como está retocado, muestra también cómo quería el poder ser recordado.</li>
  </ul>
  <h4>David y Napoleón</h4>
  <p>El pintor de la Revolución termina siendo el pintor del emperador. Los dos ganan: David obtiene el cargo más alto al que podía aspirar un artista; Napoleón, la imagen oficial de su reinado.</p>
  <p>${T}Al ver el cuadro terminado, Napoleón habría dicho que aquello no era una pintura, que se caminaba dentro de ella. Es justo lo que acabas de hacer.</p>
  <p>${D}David pintó una segunda versión, casi igual, que está en el Palacio de Versalles (terminada en 1822).</p>` },

{ t:"Salgo de la catedral", place:"Con el cuaderno lleno", look:"La escena completa", f:[.5,.5,1],
  voice:`<p>Fuera sigue haciendo frío. Me llevo una idea para la exposición: este cuadro no cuenta lo que pasó, cuenta lo que Napoleón quería que se recordara. Y lo hace tan bien que doscientos años después seguimos mirándolo.</p>`,
  ap:"Apartado 8. Conclusión, bibliografía y exposición",
  work:`<h4>Conclusión (escríbela con tus palabras)</h4>
  <p>Es una obra maestra por su técnica y, a la vez, un ejemplo muy claro de cómo el arte puede retocar la historia. Mirarlo bien obliga a preguntarse quién encargó la imagen y para qué.</p>
  <h4>Cinco ideas para la exposición</h4>
  <ol>
   <li>Es pintura neoclásica: dibujo preciso, orden y tema solemne.</li>
   <li>Muestra a Napoleón coronando a Josefina, no a sí mismo.</li>
   <li>David pasó de pintor de la Revolución a pintor del Imperio.</li>
   <li>El cuadro cambia la realidad: la madre ausente, el Papa que bendice, Josefina rejuvenecida.</li>
   <li>Es arte y es propaganda, las dos cosas a la vez.</li>
  </ol>
  <h4>Preguntas que te pueden hacer</h4>
  <details><summary>¿Por qué corona a Josefina y no a sí mismo?</summary><p>Porque la imagen resulta más amable y menos polémica que la de un hombre que se corona solo sin contar con el Papa. David llegó a dibujar la otra versión y la descartó.</p></details>
  <details><summary>¿Qué tiene de neoclásico?</summary><p>El dominio del dibujo, la composición en friso, la luz clara, el acabado liso y las referencias a Roma, como la corona de laurel.</p></details>
  <details><summary>¿Es fiel a lo que ocurrió?</summary><p>No del todo. Incluye a la madre de Napoleón, que no asistió, cambia el gesto del Papa y quita años a Josefina. Es la versión oficial.</p></details>
  <h4>Curiosidades</h4>
  <ul>
   <li>David se autorretrató en el palco, dibujando.</li>
   <li>El lienzo mide casi diez metros de ancho.</li>
   <li>En la versión de Versalles, una de las hermanas lleva el vestido rosa en lugar de blanco.</li>
  </ul>
  <h4>Bibliografía</h4>
  <ul>
   <li>Museo del Louvre, ficha de la obra en collections.louvre.fr.</li>
   <li>Gombrich, E. H., <i>La historia del arte</i>, Phaidon.</li>
   <li>Honour, H., <i>Neoclasicismo</i>, Xarait.</li>
   <li>Honour, H. y Fleming, J., <i>Historia mundial del arte</i>, Akal.</li>
   <li>Tu libro de texto.</li>
  </ul>
  <p>Comprueba la edición de cada libro antes de citarlo y cita solo los que hayas consultado.</p>` }
];

const INDEX=[
 ["Características del arte neoclásico",[1]],
 ["Época histórica",[2]],
 ["Autor, biografía y otras obras",[7]],
 ["Explicación de la obra",[0,3,4]],
 ["Por qué es importante",[9]],
 ["Simbolismo",[3,5,6,8]],
 ["David y la coronación",[9]],
 ["Conclusión y bibliografía",[10]]
];

const $=id=>document.getElementById(id);
let cur=0; const seen=new Set([0]);

function cam(f){
  const [x,y,s]=f;
  const tx=Math.min(0,Math.max(100-100*s,50-x*s*100));
  const ty=Math.min(0,Math.max(100-100*s,50-y*s*100));
  $('plate').style.transform=`translate(${tx}%,${ty}%) scale(${s})`;
  $('camera').classList.toggle('zoomed',s>1);
  const r=$('rect').style;
  r.left=(-tx/s)+'%'; r.top=(-ty/s)+'%'; r.width=(100/s)+'%'; r.height=(100/s)+'%';
}
function go(i,focus){
  cur=Math.max(0,Math.min(STOPS.length-1,i)); seen.add(cur);
  const s=STOPS[cur];
  cam(s.f);
  $('lookTitle').textContent=s.look;
  $('lookHint').textContent=s.f[2]>1?'El recuadro marca hacia dónde miras.':'Pulsa un número del cuadro para acercarte.';
  $('panel').innerHTML=`<p class="count">Parada ${cur+1} de ${STOPS.length}</p>
    <h2 id="stopTitle" tabindex="-1">${s.t}</h2><p class="place">${s.place}</p>
    <div class="voice">${s.voice}</div>
    <div class="work"><h3>${s.ap}</h3>${s.work}</div>
    <p class="legend">${D}hecho comprobado. ${I}lectura de los historiadores. ${T}anécdota repetida, sin prueba firme.</p>`;
  [...$('rail').children].forEach((li,k)=>{const b=li.firstChild;
    b.classList.toggle('seen',seen.has(k)); k===cur?b.setAttribute('aria-current','step'):b.removeAttribute('aria-current');});
  $('prev').disabled=cur===0;
  $('next').disabled=cur===STOPS.length-1;
  if(focus){$('stopTitle').focus({preventScroll:true});
    if(window.matchMedia('(max-width:59.99rem)').matches) $('panel').scrollIntoView({behavior:'smooth',block:'start'});}
}

STOPS.forEach((s,i)=>{
  const li=document.createElement('li'),b=document.createElement('button');
  b.type='button'; b.textContent=i+1; b.setAttribute('aria-label',`Parada ${i+1}: ${s.t}`); b.title=s.t;
  b.onclick=()=>go(i,true); li.appendChild(b); $('rail').appendChild(li);
  if(s.f[2]>1){const p=document.createElement('button');p.type='button';p.className='pin';p.textContent=i+1;
    p.style.left=(s.f[0]*100)+'%';p.style.top=(s.f[1]*100)+'%';p.setAttribute('aria-label',`Ir a la parada ${i+1}: ${s.look}`);
    p.title=s.look;p.onclick=()=>go(i,true);$('pins').appendChild(p);}
});
INDEX.forEach(([name,stops])=>{
  const li=document.createElement('li'); li.append(name+':');
  stops.forEach(k=>{const b=document.createElement('button');b.type='button';b.textContent='parada '+(k+1);b.onclick=()=>go(k,true);li.appendChild(b);});
  $('index').appendChild(li);
});
$('prev').onclick=()=>go(cur-1,true);
$('next').onclick=()=>go(cur+1,true);
document.addEventListener('keydown',e=>{
  if(e.target.closest('summary,details')) return;
  if(e.key==='ArrowRight') go(cur+1,false);
  if(e.key==='ArrowLeft') go(cur-1,false);
});
go(0,false);
</script>
